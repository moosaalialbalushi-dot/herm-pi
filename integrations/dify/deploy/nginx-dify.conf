# Reverse proxy for Dify at dify.kadindustries.org.
#
# Use this only when your OWN nginx fronts Dify. Dify's bundled nginx must then
# NOT hold the public ports, or whichever starts second fails to bind. Set this
# in Dify's docker/.env before using this file:
#
#   EXPOSE_NGINX_PORT=127.0.0.1:8080
#   EXPOSE_NGINX_SSL_PORT=127.0.0.1:8443
#
# If you serve Dify's bundled nginx directly instead, configure it through
# docker/.env and ignore this file entirely.
#
# Install: /etc/nginx/sites-available/dify.conf, symlink into sites-enabled,
# then `nginx -t && systemctl reload nginx`.

# Only forward the upgrade handshake when the client actually asked for one.
# Sending "Connection: upgrade" on every request would close the upstream
# connection each time and defeat the keepalive pool below.
map $http_upgrade $dify_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream dify {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name dify.kadindustries.org;

    # Keep ACME reachable before redirecting everything else.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dify.kadindustries.org;

    # HTTP/2 is off by default so this file passes `nginx -t` everywhere.
    # Enable it with whichever form your nginx accepts:
    #   nginx 1.25.1 and newer:  http2 on;
    #   older builds (Ubuntu 24.04 ships 1.24, Debian 12 ships 1.22):
    #                            listen 443 ssl http2;  (replacing the line above)

    # Cloudflare Origin Certificate, or Let's Encrypt if the hostname is
    # DNS-only. With Cloudflare proxying, set the SSL/TLS mode to Full (strict)
    # so this certificate is actually validated.
    ssl_certificate     /etc/ssl/dify/origin.crt;
    ssl_certificate_key /etc/ssl/dify/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Must be >= UPLOAD_FILE_SIZE_LIMIT and <= the upstream proxy's body cap.
    client_max_body_size 100M;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Dify builds absolute URLs from this; without it every generated link
    # comes back as http:// and browsers block it as mixed content.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $dify_connection_upgrade;

    # Service API and console streaming endpoints emit Server-Sent Events.
    # Buffering here makes a streaming answer arrive as one delayed blob, which
    # reads as "Dify is hung" from every client.
    location ~ ^/(v1|console/api|api)/ {
        proxy_pass http://dify;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # Long workflow runs and slow models hold the connection open.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Tell any downstream proxy that also honours it not to buffer.
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://dify;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
